  <style>
    :root {
      color-scheme: light;
      --page: #f2efe7;
      --paper: #fcfaf5;
      --ink: #1e352f;
      --quiet: #4d6158;
      --green: #173831;
      --gold: #f2cc78;
      --gold-soft: #f9edcd;
      --card-width: 3.75rem;
      --group-gap: 6px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
      background: var(--page);
      color: var(--ink);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible { outline: 3px solid #a46118; outline-offset: 3px; }
    h1, h2, h3, p { margin: 0; }

    .shell { width: min(100% - 40px, 960px); margin-inline: auto; }
    .masthead { background: var(--green); color: white; padding: 12px 0; }
    .masthead .shell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 24px;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: .65rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.55rem, 3.8vw, 2.55rem);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: 1;
    }
    h1 img { flex: none; width: .95em; height: .95em; }
    main { padding: 23px 0 42px; }
    .sticky-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--page);
      padding: 10px 0;
    }
    .scoreboard {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px clamp(8px, 3vw, 24px);
      margin-bottom: 8px;
      padding: 6px 10px;
      border: 1px solid #dde2d6;
      border-radius: 9px;
      background: var(--paper);
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      color: var(--quiet);
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .score { min-width: 5.75rem; }
    .score-value { line-height: 1; }
    .score-value strong {
      color: var(--green);
      font-size: 1.85rem;
      letter-spacing: -.045em;
    }
    .score-value span { color: var(--quiet); font-size: .85rem; }
    .stat-value { font-size: 1rem; font-weight: 700; }
    .sound-toggle {
      display: grid;
      place-items: center;
      flex: none;
      width: 44px;
      margin-inline-start: auto;
      padding: 0;
      color: var(--green);
    }
    .sound-toggle svg { width: 19px; height: 19px; }
    .sound-toggle[aria-pressed="false"] { color: var(--quiet); }
    .sound-toggle[aria-pressed="true"] .sound-slash,
    .sound-toggle[aria-pressed="false"] .sound-waves { display: none; }
    .score-meter {
      display: block;
      width: 100%;
      height: 4px;
      margin-top: 5px;
      border: 0;
      border-radius: 4px;
      background: #dbe4d9;
      appearance: none;
    }
    .score-meter::-webkit-meter-bar { background: #dbe4d9; border: 0; border-radius: 4px; }
    .score-meter::-webkit-meter-optimum-value { background: #3b705b; border-radius: 4px; }
    .score-meter::-moz-meter-bar { background: #3b705b; border-radius: 4px; }
    .round-result {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 5px 10px;
      width: fit-content;
      max-width: 100%;
    }
    .round-result[data-solved="true"] {
      padding: 3px 6px 3px 10px;
      border: 1px solid #cbdacf;
      border-radius: 9px;
      background: #e8eee4;
      box-shadow: inset 3px 0 #719182;
    }
    .round-message {
      color: #234737;
      font: 500 1.25rem/1.12 Georgia, "Times New Roman", serif;
      letter-spacing: -.025em;
    }
    .round-message:empty { position: absolute; }
    .detail { font-size: .88rem; color: var(--quiet); }
    .deck-status { margin-top: 8px; }
    .deck-status:empty { display: none; }
    .rules { max-width: 42ch; }
    .rules summary { width: fit-content; cursor: pointer; }
    .rules p { margin-top: .55rem; }
    .project-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .project-links a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 4px 12px;
      border: 1px solid #b6c9bb;
      border-radius: 8px;
      background: var(--paper);
      color: #355b47;
      font-size: .8rem;
      font-weight: 650;
      text-decoration: none;
    }
    .project-links a:hover { background: #e8eee4; }
    .project-links a:focus-visible { outline: 2px solid #a46118; outline-offset: 3px; }
    .play-field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 12px 0 17px; }
    .wildlife-board {
      --card-width: 6.25rem;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    .wildlife-board #tray-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 5.25rem), 1fr));
      padding: 4px;
      border-radius: 6px;
      background: #e8eae0;
    }
    .wildlife-board #tray-cards .card { width: 100%; }
    .wildlife-board .card-face {
      container-type: inline-size;
      grid-template-columns: minmax(0, 1fr);
      align-content: center;
      gap: 1px;
      padding-inline: 2px;
      font-weight: 500;
      line-height: 1.1;
      overflow-wrap: normal;
    }
    .card-given { font-size: .69rem; }
    .card-surname {
      max-inline-size: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-name-long {
      font-size: .58rem;
      font-size: min(.75rem, calc(165cqi / var(--surname-length)));
      letter-spacing: -.02em;
    }
    .card-list, .categories { display: flex; flex-wrap: wrap; gap: 8px var(--group-gap); }
    .categories { gap: 10px; align-items: flex-start; }
    .category-name { font-size: 1rem; margin-bottom: 6px; }
    .pool, .category {
      position: relative;
      isolation: isolate;
      min-height: 44px;
    }
    .tray-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 2px 10px;
      padding-bottom: 6px;
      pointer-events: none;
    }
    .tray-heading .category-name { margin: 0; }
    .card-list { pointer-events: none; }
    .category {
      flex: 0 0 auto;
      width: max(8rem, calc(var(--card-count) * var(--card-width) + 6px));
      max-width: 100%;
      padding: 0 3px 3px;
      border-radius: 5px;
      background: #253a31;
      color: #fffaf0;
    }
    .category-heading {
      min-height: 28px;
      padding: 5px;
      pointer-events: none;
    }
    .category .category-name {
      font-size: .71rem;
      font-weight: 780;
      letter-spacing: .07em;
      margin: 0;
      text-transform: uppercase;
    }
    .category .card-list { gap: 0; }
    .category .card {
      border-radius: 0;
      color: #fff;
    }
    .card[data-placement="correct"] {
      --tile-light: #3b705b;
      --tile-dark: #2e5a49;
    }
    .card[data-placement="incorrect"] {
      --tile-light: #984f49;
      --tile-dark: #7c403c;
    }
    .category .card-face {
      border: 1px solid #0005;
      border-radius: 1px;
      background: linear-gradient(145deg, var(--tile-light), var(--tile-dark));
      box-shadow: inset 1px 1px #ffffff26, inset -1px -1px #0004;
    }
    .box-target {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      padding: 0;
      border: 1px solid transparent;
      border-radius: inherit;
      background: transparent;
    }
    .category .box-target[data-can-place],
    .box-target[aria-pressed="true"],
    .box-target[aria-pressed="mixed"] {
      box-shadow: inset 0 0 0 2px var(--gold);
    }
    .pool .box-target[data-can-place] { outline: 2px solid #719182; outline-offset: 2px; }
    .pool .box-target:focus-visible { outline: 3px solid #a46118; outline-offset: 3px; }
    .card {
      display: grid;
      pointer-events: auto;
      position: relative;
      flex: none;
      width: var(--card-width);
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font-family: "Avenir Next", system-ui, sans-serif;
      font-size: .75rem;
      font-weight: 600;
      line-height: 1.2;
    }
    .card-face {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 2.25rem;
      padding: 4px;
      border: 1px solid #bdc9bd;
      border-radius: inherit;
      background: var(--paper);
      box-shadow: 0 2px 4px #1e352f19;
      overflow-wrap: anywhere;
      pointer-events: none;
      transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
    }
    .pool .card[aria-pressed="true"] .card-face {
      background: var(--gold-soft);
      border-color: #976420;
      outline: 2px solid #a97730;
      outline-offset: 1px;
      transform: translateY(-3px);
      box-shadow: 0 5px 9px #42361c30;
    }
    .category .card[aria-pressed="true"] .card-face {
      outline: 2px solid #fff0bd;
      outline-offset: -3px;
      box-shadow: inset 2px 2px #fff6, inset -2px -2px #0003;
    }
    .card:focus-visible { outline: 3px solid #a46118; outline-offset: 3px; }
    .category .card:focus-visible { outline-offset: -3px; z-index: 1; }
    .button {
      min-height: 44px;
      padding: 6px 13px;
      border: 1px solid #aebfb1;
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      font-size: .88rem;
      font-weight: 720;
    }
    .button.primary { background: var(--green); border-color: var(--green); color: white; }
    .button.replay {
      min-height: 34px;
      padding: 3px 8px;
      border-color: #b6c9bb;
      background: #f7faf5;
      color: #355b47;
      font-size: .78rem;
      font-weight: 640;
    }
    .button:disabled { background: #e7e9df; border-color: #d6dbce; color: #56675e; }
    @media (pointer: coarse) {
      .card-face { min-height: 2.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card-face { transition: none; }
    }

    @media (hover: hover) {
      .button:not(:disabled):hover { box-shadow: inset 0 0 0 1px currentColor; }
      .card:not(:disabled):hover .card-face { border-color: var(--quiet); }
    }
    @media (max-width: 660px) {
      .shell { width: calc(100% - 16px); }
      main { padding-top: 12px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .masthead { padding-block: 6px; }
      main { padding-top: 6px; }
      .sticky-bar { padding-block: 4px; }
      .scoreboard { margin-bottom: 0; }
      .play-field { row-gap: 6px; padding-top: 6px; }
      .wildlife-board #tray-cards { row-gap: 4px; }
    }

    #reward-peek { min-height: 60px; }
    .reward-card {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 60px;
      font-size: .85rem;
    }
    .reward-card img {
      width: 56px;
      height: 56px;
      flex: none;
      border-radius: 6px;
    }
    #reward-review-hint { margin: 3px 0 8px; font-size: .78rem; }
    .category-description { color: #d5e0d7; font-size: .68rem; line-height: 1.3; }
    .wildlife-board .category {
      width: max(9rem, calc(var(--card-count) * var(--card-width) + 6px));
    }
    #reward-revisit { margin: 8px 0; }
    #reward-mismatches { margin: 4px 0; padding-inline-start: 1.25em; font-size: .85rem; }
    #reward-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: 8px 12px;
    }
    .reward-thumbnails { display: flex; flex-wrap: wrap; gap: 4px; }
    .reward-thumbnails button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }
    .reward-thumbnails img { border-radius: 4px; }
  </style>
</head>

    const rewardSeen = new Set();
    const rewardCompletedGroups = new Set();
    const rewardPeek = document.getElementById("reward-peek");
    const rewardReview = document.getElementById("reward-review");
    const rewardReviewHint = document.getElementById("reward-review-hint");
    const rewardRevisit = document.getElementById("reward-revisit");
    const rewardMismatches = document.getElementById("reward-mismatches");
    const rewardGallery = document.getElementById("reward-gallery");
    let rewardGalleryKey = "";
    let rewardReviewAutoOpened = false;

    function rewardName(name) {
      return name[0].toUpperCase() + name.slice(1);
    }

    function rewardCard(name) {
      const [src, facts] = rewardData[name];
      const row = document.createElement("div");
      row.className = "reward-card";

      const image = new Image(56, 56);
      image.src = src;
      image.alt = "";

      const label = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = rewardName(name);
      label.append(title, document.createTextNode(" · " + facts));
      row.append(image, label);
      return row;
    }

    function rewardReset() {
      rewardSeen.clear();
      rewardCompletedGroups.clear();
      rewardPeek.replaceChildren();
      rewardPeek.hidden = false;
      rewardMismatches.replaceChildren();
      rewardGallery.replaceChildren();
      rewardGalleryKey = "";
      rewardReviewAutoOpened = false;
      rewardRevisit.hidden = true;
      rewardReview.hidden = true;
      rewardReview.open = false;
      rewardReviewHint.hidden = true;
    }

    function rewardGroupSolved(category) {
      return [...cardDetails].every(([name, card]) =>
        (state.assigned.get(name) === category) === (card.category === category)
      );
    }

    function rewardGroup(category) {
      const group = document.createElement("section");
      const heading = document.createElement("h3");
      heading.textContent = categories[category];

      const thumbnails = document.createElement("div");
      thumbnails.className = "reward-thumbnails";
      const preview = document.createElement("div");
      preview.setAttribute("role", "status");
      preview.setAttribute("aria-atomic", "true");

      for (const [name, card] of cardDetails) {
        if (card.category !== category) continue;
        const button = document.createElement("button");
        button.type = "button";
        const image = new Image(40, 40);
        image.src = rewardData[name][0];
        image.alt = rewardName(name);
        button.append(image);
        button.addEventListener("click", () => {
          preview.replaceChildren(rewardCard(name));
        });
        thumbnails.append(button);
      }

      group.append(heading, thumbnails, preview);
      return group;
    }

    function rewardRenderReview() {
      const roundComplete = state.allPlacedAt !== null;
      rewardReviewHint.hidden = !roundComplete;
      const categoryIds = [...categories.keys()];
      const solved = categoryIds.filter(rewardGroupSolved);
      const firstCompleted = rewardCompletedGroups.size === 0 && solved.length > 0;
      const groupCompleted = solved.some(category => !rewardCompletedGroups.has(category));
      for (const category of solved) rewardCompletedGroups.add(category);

      const groups = roundComplete ? categoryIds : solved;
      const key = groups.join(",");
      if (key !== rewardGalleryKey) {
        rewardGallery.replaceChildren(...groups.map(rewardGroup));
        rewardGalleryKey = key;
      }

      if (roundComplete) {
        const mismatches = [];
        for (const [name, card] of cardDetails) {
          const placed = state.assigned.get(name);
          if (placed === card.category) continue;
          const row = document.createElement("li");
          const from = categories[placed] ?? "Tray";
          row.textContent = rewardName(name) + " · " + from + " → " + categories[card.category];
          mismatches.push(row);
        }
        rewardMismatches.replaceChildren(...mismatches);
        rewardRevisit.hidden = mismatches.length === 0;
      }

      rewardReview.hidden = groups.length === 0;
      if (roundComplete && !rewardReviewAutoOpened) {
        rewardReview.open = true;
        rewardReviewAutoOpened = true;
      } else if (!roundComplete && firstCompleted) {
        rewardReview.open = true;
      }
      return groupCompleted;
    }

    function rewardMove(moved, destination) {
      if (state.allPlacedAt === null) {
        let latest;
        for (const name of moved) {
          if (cardDetails.get(name).category !== destination || rewardSeen.has(name)) continue;
          rewardSeen.add(name);
          latest = name;
        }
        if (latest) rewardPeek.replaceChildren(rewardCard(latest));
      } else {
        rewardPeek.replaceChildren();
        rewardPeek.hidden = true;
      }
      return rewardRenderReview();
    }
    const embeddedDemo = $("embedded-demo");
    const unassigned = -1;
    const maxPointsPerCard = 2;
    const field = $("field");
    let categories;
    let cardDetails;
    const soundButton = $("sound");
    const soundPreferenceKey = "constrained-sorting:sound";
    // Each note is pitch, start offset, duration, peak, and optional pitch glide.
    const notesByCue = {
      pick: [[392, 0, .045, .032, .75]],
      tray: [[330, 0, .075, .05, .7]],
      miss: [[196, 0, .105, .085, .82]],
      mixed: [[196, 0, .072, .067, .85], [523.25, .06, .09, .048]],
      match: [[523.25, 0, .08, .07], [659.25, .055, .115, .075]],
      correct: [[392, 0, .07, .052], [523.25, .055, .105, .058]],
      group: [[587.33, 0, .10, .047], [739.99, .055, .12, .048], [880, .11, .17, .044]],
      finishIncomplete: [
        [659.25, 0, .25, .065], [587.33, .16, .25, .062],
        [523.25, .32, .26, .057], [440, .49, .24, .056],
        [293.66, .68, .71, .068], [174.61, .68, .75, .049],
        [220, .68, .68, .037]
      ],
      // A rising arpeggio resolves into a sustained C-major chord.
      finish: [
        [261.63, 0, .22, .067], [392, .09, .2, .069], [523.25, .18, .21, .072],
        [659.25, .27, .22, .077], [783.99, .36, .21, .082],
        [196, .43, .28, .061], [987.77, .45, .24, .078], [1174.66, .54, .17, .073],
        [130.81, .71, 1.08, .086], [196, .71, 1.02, .038], [261.63, .71, 1.02, .044],
        [329.63, .71, .97, .048], [392, .71, .96, .043], [523.25, .71, .88, .052],
        [1046.5, .71, .91, .081], [1567.98, .82, .6, .025]
      ]
    };
    let state;
    let clock;
    let soundEnabled = true;
    let audioContext;
    let activeCue;
    let cueRequest = 0;

    try {
      soundEnabled = localStorage.getItem(soundPreferenceKey) !== "off";
    } catch {
      // Some local previews block access to storage.
    }

    function paintSoundControl() {
      soundButton.setAttribute("aria-pressed", soundEnabled);
      soundButton.title = soundEnabled ? "Sound on" : "Sound off";
    }

    function stopCue() {
      cueRequest++;
      if (activeCue) {
        activeCue.gain.setTargetAtTime(0, audioContext.currentTime, .006);
        activeCue = null;
      }
    }

    async function playCue(cue) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!soundEnabled || !AudioContext) return;
      try {
        const context = audioContext ??= new AudioContext();
        stopCue();
        const request = cueRequest;
        if (context.state !== "running") await context.resume();
        if (request !== cueRequest || context.state !== "running") return;

        const output = context.createGain();
        output.connect(context.destination);
        activeCue = output;
        const cueStart = context.currentTime + .008;
        const notes = notesByCue[cue];
        let remaining = notes.length;
        for (const [pitch, offset, duration, peak, glide = 1] of notes) {
          const start = cueStart + offset;
          const end = start + duration;
          const tone = context.createOscillator();
          const envelope = context.createGain();
          tone.type = pitch < 250 ? "sine" : "triangle";
          tone.frequency.setValueAtTime(pitch, start);
          if (glide !== 1) tone.frequency.exponentialRampToValueAtTime(pitch * glide, end);
          envelope.gain.setValueAtTime(.001, start);
          envelope.gain.linearRampToValueAtTime(peak, start + .007);
          if (cue === "finish" && duration > .5) {
            envelope.gain.exponentialRampToValueAtTime(peak * .55, start + duration * .36);
          }
          envelope.gain.exponentialRampToValueAtTime(.001, end);
          tone.connect(envelope);
          envelope.connect(output);
          tone.onended = () => {
            tone.disconnect();
            envelope.disconnect();
            if (--remaining === 0) {
              output.disconnect();
              if (activeCue === output) activeCue = null;
            }
          };
          tone.start(start);
          tone.stop(end);
        }
      } catch {
        // Playback is optional when the browser blocks or lacks audio.
      }
    }

    function element(tag, className, label) {
      const item = document.createElement(tag);
      if (className) item.className = className;
      if (label !== undefined) item.textContent = label;
      return item;
    }

    function shuffledDeck() {
      const deck = [...cardDetails.keys()];
      for (let index = deck.length - 1; index > 0; index--) {
        const other = Math.floor(Math.random() * (index + 1));
        [deck[index], deck[other]] = [deck[other], deck[index]];
      }
      if (state && deck.length > 1 && deck.every((card, index) => card === state.deck[index])) {
        deck.push(deck.shift());
      }
      return deck;
    }

    function newPlay() {
      rewardReset();
      clearInterval(clock);
      stopCue();
      state = {
        deck: shuffledDeck(),
        assigned: new Map(),
        selected: new Set(),
        cardMoves: new Map(),
        moves: 0,
        startedAt: null,
        allPlacedAt: null,
        celebrated: false
      };
      paintTimer();
      renderBoard();
    }

    function loadDeck() {
      try {
        const target = JSON.parse(embeddedDemo.textContent);
        const names = Object.keys(target);
        const cards = new Map();
        for (const [category, name] of names.entries()) {
          const entries = target[name];
          if (!name.trim() || !Array.isArray(entries) || !entries.length) throw new Error("Invalid category");
          for (const entry of entries) {
            const nameParts = Array.isArray(entry) ? entry : null;
            const parts = nameParts ?? [entry];
            if ((nameParts && nameParts.length !== 2) ||
                parts.some(part => typeof part !== "string" || !part.trim())) throw new Error("Invalid card");
            const label = parts.join(" ");
            if (cards.has(label)) throw new Error("Duplicate card");
            cards.set(label, { category, nameParts });
          }
        }
        if (!cards.size) throw new Error("Empty deck");
        categories = names;
        cardDetails = cards;
        $("points-max").textContent = `/ ${cards.size * maxPointsPerCard}`;
        $("points-meter").max = cards.size * maxPointsPerCard;
        state = null;
        newPlay();
      } catch {
        $("deck-status").textContent = "Couldn’t load the deck.";
      }
    }

    function destinationOf(card) {
      return state.assigned.get(card) ?? unassigned;
    }

    function cardsIn(destination) {
      return state.deck.filter(card => destinationOf(card) === destination);
    }

    function paintTimer() {
      const seconds = state.startedAt === null ? 0
        : Math.floor(((state.allPlacedAt ?? performance.now()) - state.startedAt) / 1000);
      $("elapsed").textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function updateMetrics(groups) {
      const placed = state.assigned.size;
      const total = cardDetails.size;
      const correct = groups.reduce((sum, group) => sum + group.correct, 0);
      const points = groups.reduce((sum, group) => sum + group.points, 0);

      $("points-meter").value = points;
      $("points").textContent = points;
      $("efficiency-value").textContent = state.moves ? `${Math.round(100 * placed / state.moves)}%` : "—";
      const result = $("round-result");
      const solved = correct === total;
      result.hidden = placed !== total;
      result.dataset.solved = solved;
      const message = $("round-message");
      const nextMessage = solved ? "Perfect sort" : "";
      if (message.textContent !== nextMessage) message.textContent = nextMessage;
    }

    function paintSelection(changedCards = field.querySelectorAll("[data-card]")) {
      for (const card of changedCards) {
        card.setAttribute("aria-pressed", state.selected.has(card.dataset.card));
      }
      const selected = [...state.selected];
      const emptyTray = state.assigned.size === cardDetails.size;
      $("tray").hidden = emptyTray && !selected.length;
      $("tray-title").textContent = emptyTray ? "Return to tray" : "Tray";
      $("tray-hint").hidden = emptyTray;
      for (const button of field.querySelectorAll("[data-destination]")) {
        const destination = Number(button.dataset.destination);
        const name = categories[destination] ?? "Tray";
        const canPlace = selected.some(card => destinationOf(card) !== destination);
        button.toggleAttribute("data-can-place", canPlace);
        if (canPlace || destination === unassigned) {
          button.disabled = !canPlace;
          button.removeAttribute("aria-pressed");
          button.setAttribute("aria-label", `Move selected cards to ${name}`);
          continue;
        }
        const cards = cardsIn(destination);
        const count = cards.filter(card => state.selected.has(card)).length;
        const allSelected = cards.length > 0 && count === cards.length;
        button.disabled = !cards.length;
        button.setAttribute("aria-pressed", allSelected ? "true" : count ? "mixed" : "false");
        button.setAttribute("aria-label", `${allSelected ? "Deselect" : "Select"} all cards in ${name}`);
      }
    }

    function cardButton(card) {
      const button = element("button", "card");
      button.type = "button";
      button.dataset.card = card;
      const info = cardDetails.get(card);
      const face = element("span", "card-face");
      if (info.nameParts) {
        const [given, last] = info.nameParts;
        const surname = element("span", "card-surname", last);
        if (last.length >= 13) {
          surname.classList.add("card-name-long");
          surname.style.setProperty("--surname-length", last.length);
        }
        face.append(element("span", "card-given", given), surname);
        button.setAttribute("aria-label", card);
      } else {
        face.textContent = card;
      }
      const destination = destinationOf(card);
      if (destination !== unassigned) {
        const placement = info.category === destination ? "correct" : "incorrect";
        button.dataset.placement = placement;
        button.setAttribute("aria-label", `${card}, ${placement} placement`);
      }
      button.append(face);
      return button;
    }

    function cardList(cards) {
      const list = element("div", "card-list");
      list.append(...cards.map(cardButton));
      return list;
    }

    function categoryPanel({ name, index, cards }) {
      const section = element("section", "category");
      section.dataset.category = index;
      section.setAttribute("aria-label", name);
      section.style.setProperty("--card-count", cards.length);
      const target = element("button", "box-target");
      target.type = "button";
      target.dataset.destination = index;
      const heading = element("div", "category-heading");
      heading.append(
        element("h2", "category-name", name),
        element("p", "category-description", tierDescriptions[name])
      );
      section.append(target, heading, cardList(cards));
      return section;
    }

    function renderBoard(previous = new Map()) {
      const trayCards = cardsIn(unassigned);
      $("tray-cards").replaceChildren(...trayCards.map(cardButton));
      const groups = categories.map((name, index) => {
        const cards = cardsIn(index);
        const correctCards = cards.filter(card => cardDetails.get(card).category === index);
        const correct = correctCards.length;
        const points = correctCards.reduce((sum, card) =>
          sum + Math.max(0, maxPointsPerCard + 1 - state.cardMoves.get(card)), 0);
        return { name, index, cards, correct, points };
      });
      updateMetrics(groups);
      $("categories").replaceChildren(...groups.map(categoryPanel));
      paintSelection();

      for (const card of field.querySelectorAll("[data-card]")) {
        const before = previous.get(card.dataset.card);
        if (!before) continue;
        const face = card.firstElementChild;
        const after = face.getBoundingClientRect();
        const x = before.left - after.left;
        const y = before.top - after.top;
        if (x || y) {
          face.animate(
            [{ transform: `translate(${x}px, ${y}px)` }, { transform: "none" }],
            { duration: 200, easing: "ease-out" }
          );
        }
      }
    }

    function assignSelection(destination, focusAfterMove = false) {
      const moved = [...state.selected].filter(card => destinationOf(card) !== destination);
      if (!moved.length) return;
      const previous = new Map();
      // Skip board-wide animation on large decks to keep batch moves responsive.
      if (cardDetails.size <= 120 && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        for (const card of field.querySelectorAll("[data-card]")) {
          previous.set(card.dataset.card, card.firstElementChild.getBoundingClientRect());
        }
      }
      if (state.startedAt === null) {
        state.startedAt = performance.now();
        clock = setInterval(paintTimer, 250);
      }
      for (const card of moved) {
        state.cardMoves.set(card, (state.cardMoves.get(card) ?? 0) + 1);
        if (destination === unassigned) state.assigned.delete(card);
        else state.assigned.set(card, destination);
      }
      state.moves += moved.length;
      state.selected.clear();
      const completedRound = state.allPlacedAt === null && state.assigned.size === cardDetails.size;
      if (completedRound) {
        state.allPlacedAt = performance.now();
        clearInterval(clock);
        paintTimer();
      }
      renderBoard(previous);
      const groupCompleted = rewardMove(moved, destination);
      if (focusAfterMove) {
        const target = field.querySelector(`[data-destination="${destination}"]`);
        const focus = target?.disabled
          ? field.querySelector(`[data-card="${CSS.escape(moved[0])}"]`)
          : target;
        focus?.focus();
      }
      if (!state.celebrated && state.assigned.size === cardDetails.size &&
          state.deck.every(card => destinationOf(card) === cardDetails.get(card).category)) {
        state.celebrated = true;
        playCue("finish");
      } else if (completedRound) {
        playCue("finishIncomplete");
      } else if (groupCompleted) {
        playCue("group");
      } else if (destination === unassigned) {
        playCue("tray");
      } else {
        const correct = moved.filter(card => cardDetails.get(card).category === destination);
        if (!correct.length) playCue("miss");
        else if (correct.length !== moved.length) playCue("mixed");
        else playCue(correct.every(card => state.cardMoves.get(card) === 1) ? "match" : "correct");
      }
    }

    function toggleCategory(index) {
      const cards = cardsIn(index);
      const allSelected = cards.every(card => state.selected.has(card));
      for (const card of cards) {
        if (allSelected) state.selected.delete(card);
        else state.selected.add(card);
      }
    }

    field.addEventListener("click", event => {
      const card = event.target.closest("[data-card]");
      const target = event.target.closest("[data-destination]");
      if (!card && (!target || target.disabled)) return;
      if (card) {
        const name = card.dataset.card;
        if (state.selected.has(name)) state.selected.delete(name);
        else state.selected.add(name);
      } else {
        const destination = Number(target.dataset.destination);
        if (target.hasAttribute("data-can-place")) {
          assignSelection(destination, event.detail === 0);
          return;
        }
        toggleCategory(destination);
      }
      paintSelection(card ? [card] : target.closest(".category").querySelectorAll("[data-card]"));
      playCue("pick");
    });
    $("retry").addEventListener("click", () => {
      newPlay();
      window.scrollTo(0, 0);
      field.querySelector("[data-card]")?.focus({ preventScroll: true });
    });
    soundButton.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      paintSoundControl();
      try {
        localStorage.setItem(soundPreferenceKey, soundEnabled ? "on" : "off");
      } catch {
        // The setting still applies until the page closes.
      }
      if (soundEnabled) playCue("pick");
      else stopCue();
    });

    paintSoundControl();
    loadDeck();
  </script>
</body>
</html>
